<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noxo Home — Panel</title><link rel="stylesheet" href="panel.css"></head><body><div class="shell"><header><div><small>NOXO HOME</small><h1>Configuration</h1></div><a href="/">← Dashboard</a></header><div id="toast"></div><section class="hero"><div><b>Mode édition</b><p>Ajoute, supprime et configure tes appareils sans toucher au code.</p></div><button id="test">Tester Home Assistant</button></section><div class="grid"><section class="card"><div class="head"><div><small>CONNEXION</small><h2>Home Assistant</h2></div></div><label>URL<input id="haUrl" placeholder="http://homeassistant.local:8123"></label><label>Long-Lived Access Token<input id="haToken" type="password" placeholder="Colle ton token ici"></label><button class="primary" id="saveConnection">Enregistrer la connexion</button></section><section class="card"><div class="head"><div><small>APPAREILS</small><h2>Widgets</h2></div><button class="primary" id="addWidget">+ Ajouter</button></div><div id="widgets"></div></section><section class="card"><div class="head"><div><small>FOYER</small><h2>Profils</h2></div></div><div id="profiles"></div></section><section class="card"><div class="head"><div><small>VÉHICULE</small><h2>Véhicule</h2></div></div><div id="vehicle"></div></section><section class="card full"><div class="head"><div><small>SCÈNES</small><h2>Raccourcis</h2></div><button class="primary" id="addScene">+ Scène</button></div><div id="scenes"></div></section></div></div><div class="modal hidden" id="modal"><div class="modal-box"><div class="modal-head"><div><small id="modalKicker">APPAREIL</small><h2 id="modalTitle">Configurer</h2></div><button id="close">×</button></div><form id="form"></form></div></div><script src="panel.js"></script></body></html>
